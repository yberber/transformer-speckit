# The six built-in examples (FR-003, research R20). Titles are UI strings in the i18n catalogs
# (`example.<id>.title`). The first entry is the default example.
#
# Rules checked by `python -m tools.generate_examples`:
# - id matches ^[a-z0-9-]{1,40}$; length is short | medium | long, exactly two of each
# - English text to continue (not a question, no trailing "?")
# - input tokens: short 5–15, medium 20–35, long 50–64 (never above max_input_tokens)
# - 20 generated steps or an end-of-text stop, with a top-1/top-2 probability margin ≥ 1e-3
#   at every step

