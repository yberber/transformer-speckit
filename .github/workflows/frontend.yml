# Frontend checks and GitHub Pages deploy. Every check job must pass before `deploy` runs, and
# `main` is protected with these jobs as required status checks (see README "CI").
name: frontend

on:
  push:
  pull_request:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

defaults:
  run:
    working-directory: frontend

jobs:
  static:
    name: lint, types, API types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run check:api-types

  test:
    name: unit and contract tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # Includes the architecture-literal scan (T048) and the README doc check (T049a).
      - run: npm run test:unit
      - run: npm run test:contract

  build:
    name: build and budgets
    runs-on: ubuntu-latest
    env:
      # From repository variables. GitHub Pages serves the site from /<repo>/ unless VITE_BASE
      # says otherwise (e.g. "/" for a custom domain). Live mode stays hidden while
      # VITE_API_BASE_URL is unset; the Space page link (VITE_SPACE_URL) while it is unset.
      VITE_BASE: ${{ vars.VITE_BASE || format('/{0}/', github.event.repository.name) }}
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      VITE_SPACE_URL: ${{ vars.VITE_SPACE_URL }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run check:budgets
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  e2e:
    name: end-to-end and accessibility
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # The full default matrix, no server needed: chromium (1280 px) and mobile (360 px) run
      # every suite except the live ones; the `live` project runs @live and @privacy, and the
      # live-mode cases of @a11y, @keyboard and @share, against a second build with a mocked
      # API. This guard fails if a suite drops out of the matrix (a tag or project filter
      # changed) instead of letting it pass silently with zero tests.
      - name: every e2e suite is in the default matrix
        run: |
          npx playwright test --list > "$RUNNER_TEMP/e2e-list.txt"
          need() {
            grep -q -- "\[$1\] .*$2" "$RUNNER_TEMP/e2e-list.txt" || { echo "::error::no $2 tests in the $1 project"; exit 1; }
          }
          for project in chromium mobile; do
            for tag in @example-mode @a11y @keyboard @i18n @share @responsive; do need "$project" "$tag"; done
          done
          for tag in @live @privacy @a11y @keyboard; do need live "$tag"; done
      - run: npm run test:e2e
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  lighthouse:
    name: Lighthouse
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # The deployed variant, live chunk included (live mode is never the default, so the page
      # measured is example mode). VITE_BASE is left out: Lighthouse loads the site from "/".
      - run: npm run build
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SPACE_URL: ${{ vars.VITE_SPACE_URL }}
      - run: npm run lhci

  deploy:
    name: deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [static, test, build, e2e, lighthouse]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
